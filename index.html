<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  body {
    margin: 0; min-height: 100svh; display: grid; place-content: center; gap: 18px;
    padding: 24px; background: #0F0F0F; color: #FAF9F9;
    font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  form { display: grid; gap: 10px; width: min(320px, 100%) }
  h1 { margin: 0; font-size: 16px; font-weight: 600 }
  p { margin: 0; color: #949494; font-size: 13px }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid #393939; border-radius: 8px;
    background: #1d1d1d; color: #FAF9F9; font: inherit; letter-spacing: 0.06em;
  }
  input.pin { text-align: center; font-size: 22px; letter-spacing: 0.5em; padding-left: calc(12px + 0.5em) }
  input:focus-visible { outline: 2px solid #FFAD0D; outline-offset: 1px; border-color: transparent }
  button {
    padding: 10px 12px; border: 0; border-radius: 8px; background: #FFAD0D; color: #000;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button[disabled] { opacity: .6; cursor: progress }
  .msg { min-height: 18px; font-size: 13px; color: #DC2626 }
</style>
</head>

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))
  const form = document.getElementById("gate")
  const pass = document.getElementById("pass")
  const go = document.getElementById("go")
  const msg = document.getElementById("msg")
  const IS_PIN = false

  // PIN: digits only, and the sixth one submits
  if (IS_PIN)
    pass.addEventListener("input", () => {
      pass.value = pass.value.replace(/\D/g, "").slice(0, 6)
      if (pass.value.length === 6 && !go.disabled) form.requestSubmit()
    })

  form.addEventListener("submit", async (e) => {
    e.preventDefault()
    if (!pass.value) return
    go.disabled = true
    msg.style.color = "#949494"
    msg.textContent = "Unlocking…"
    // let the browser paint before PBKDF2 blocks for ~a second
    await new Promise((r) => setTimeout(r, 16))
    try {
      const base = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(pass.value), "PBKDF2", false, ["deriveKey"],
      )
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(SALT), iterations: ITERATIONS, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"],
      )
      // GCM authenticates: a wrong passphrase throws here rather than yielding garbage
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64(IV) }, key, b64(PAYLOAD),
      )
      const html = await new Response(
        new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip")),
      ).text()
      // Replace the whole document, so the unlocked page keeps this URL and its own <head>
      document.open()
      document.write(html)
      document.close()
    } catch (err) {
      go.disabled = false
      msg.style.color = "#DC2626"
      msg.textContent = window.DecompressionStream === undefined
        ? "This browser is too old to open the page."
        : IS_PIN ? "Wrong PIN." : "Wrong passphrase."
      pass.select()
    }
  })
})()
